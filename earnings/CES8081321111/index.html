let currentData = DEFAULT_DATA;
let altData = null;
let chartsInitialized = false;
let isSyncing = false;

const PLOT_IDS = ["plot1", "plot2", "plot3", "plot4"];

function getLatestNonNull(arr) {
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i] !== null && arr[i] !== undefined) return arr[i];
  }
  return null;
}

function fmtDollar(v) {
  if (v === null || v === undefined) return "—";
  return "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function fmtPct(v) {
  if (v === null || v === undefined) return "—";
  return (v * 100).toFixed(2) + "%";
}

function updateStats(data) {
  const latestAwe  = getLatestNonNull(data.awe_level);
  const latestYoy  = getLatestNonNull(data.yoy);
  const latestReal = getLatestNonNull(data.real_yoy);
  document.getElementById("statsLine").innerHTML =
    `Benchmark: <strong>${data.benchmark_name}</strong> &ensp;` +
    `Latest AWE: <strong>${fmtDollar(latestAwe)}</strong> &ensp;` +
    `Nominal YoY: <strong>${fmtPct(latestYoy)}</strong> &ensp;` +
    `Real YoY: <strong>${fmtPct(latestReal)}</strong>`;
}

function setupLinkedZoom() {
  isSyncing = false;
  PLOT_IDS.forEach(id => {
    document.getElementById(id).on("plotly_relayout", function(eventData) {
      if (isSyncing) return;
      isSyncing = true;
      const update = {};
      if (eventData["xaxis.range[0]"]) {
        update["xaxis.range[0]"] = eventData["xaxis.range[0]"];
        update["xaxis.range[1]"] = eventData["xaxis.range[1]"];
      } else if (eventData["xaxis.autorange"]) {
        update["xaxis.autorange"] = true;
      }
      PLOT_IDS.filter(p => p !== id).forEach(otherId => {
        Plotly.relayout(document.getElementById(otherId), update);
      });
      isSyncing = false;
    });
  });
}

const TICK_FMT = [
  {dtickrange: [null, "M12"], value: "%b %Y"},
  {dtickrange: ["M12", null], value: "%Y"},
];
const LAYOUT_BASE = {
  margin: {t: 36, b: 36, l: 58, r: 16},
  legend: {orientation: "h", y: -0.18, font: {size: 11}},
  hovermode: "x unified",
  xaxis: {tickformatstops: TICK_FMT},
};

function renderCharts(data) {
  const {dates, awe_level, benchmark_level, yoy, benchmark_yoy,
         real_yoy, rel_yoy, cpiu_yoy, benchmark_name} = data;
  const pct = v => (v !== null && v !== undefined) ? v * 100 : null;
  const zero = [dates[0], dates[dates.length - 1]];

  Plotly.react("plot1", [
    {x: dates, y: awe_level,       name: "AWE",          type: "scatter", mode: "lines", line: {color: "#1565c0", width: 2}},
    {x: dates, y: benchmark_level, name: benchmark_name, type: "scatter", mode: "lines", line: {color: "#78909c", width: 1.5, dash: "dash"}},
  ], {...LAYOUT_BASE,
    title: {text: "Average Weekly Earnings ($)", font: {size: 13}},
    yaxis: {tickprefix: "$", tickformat: ",.0f"},
  });

  Plotly.react("plot2", [
    {x: dates, y: yoy.map(pct),           name: "Industry",      type: "scatter", mode: "lines", line: {color: "#1565c0", width: 2}},
    {x: dates, y: benchmark_yoy.map(pct), name: benchmark_name,  type: "scatter", mode: "lines", line: {color: "#78909c", width: 1.5, dash: "dash"}},
    {x: zero,  y: [0, 0], showlegend: false, mode: "lines", line: {color: "#ccc", width: 1, dash: "dot"}},
  ], {...LAYOUT_BASE,
    title: {text: "Nominal YoY Growth (%)", font: {size: 13}},
    yaxis: {ticksuffix: "%", tickformat: ".2f"},
  });

  Plotly.react("plot3", [
    {x: dates, y: real_yoy.map(pct),  name: "Real YoY",       type: "scatter", mode: "lines", line: {color: "#1565c0", width: 2}},
    {x: dates, y: cpiu_yoy.map(pct),  name: "CPI-U Inflation", type: "scatter", mode: "lines", line: {color: "#e65100", width: 1.5, dash: "dash"}},
    {x: zero,  y: [0, 0], showlegend: false, mode: "lines", line: {color: "#ccc", width: 1, dash: "dot"}},
  ], {...LAYOUT_BASE,
    title: {text: "Real YoY Growth, CPI-U Adjusted (%)", font: {size: 13}},
    yaxis: {ticksuffix: "%", tickformat: ".2f"},
  });

  const relPct   = rel_yoy.map(pct);
  const relAbove = relPct.map(v => (v !== null && v >= 0) ? v : 0);
  const relBelow = relPct.map(v => (v !== null && v <  0) ? v : 0);
  Plotly.react("plot4", [
    {x: dates, y: relAbove, showlegend: false, mode: "lines", fill: "tozeroy", fillcolor: "rgba(21,128,61,0.15)",  line: {color: "rgba(0,0,0,0)", width: 0}},
    {x: dates, y: relBelow, showlegend: false, mode: "lines", fill: "tozeroy", fillcolor: "rgba(185,28,28,0.15)", line: {color: "rgba(0,0,0,0)", width: 0}},
    {x: dates, y: relPct,   name: "Relative YoY", mode: "lines", line: {color: "#1565c0", width: 2}},
    {x: zero,  y: [0, 0],   name: (benchmark_name || "Benchmark") + " = 0", mode: "lines", line: {color: "#555", width: 1.5}},
  ], {...LAYOUT_BASE,
    title: {text: "Relative YoY Growth vs Benchmark (%)", font: {size: 13}},
    yaxis: {ticksuffix: "%", tickformat: ".2f"},
  });

  if (!chartsInitialized) {
    setupLinkedZoom();
    chartsInitialized = true;
  }
}

// Initial render
updateStats(DEFAULT_DATA);
renderCharts(DEFAULT_DATA);

// Benchmark toggle
document.querySelectorAll("#benchmarkToggle button").forEach(btn => {
  btn.addEventListener("click", async () => {
    document.querySelectorAll("#benchmarkToggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    if (btn.dataset.bmark === "default") {
      currentData = DEFAULT_DATA;
    } else {
      if (!altData) {
        const resp = await fetch(`../data/${SERIES_ID}_alt.json`);
        altData = await resp.json();
      }
      currentData = altData;
    }
    updateStats(currentData);
    renderCharts(currentData);
  });
});
</script>
