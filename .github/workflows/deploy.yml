name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write          # needed to push to gh-pages branch

jobs:
  build-employment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # shallow clone (repo is large due to data files)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask Frozen-Flask

      - name: Build employment static site
        working-directory: employment/website
        run: python freeze.py

      - name: Deploy employment site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: employment/website/build
          destination_dir: employment
          force_orphan: false
          keep_files: true

  build-earnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask Frozen-Flask pandas numpy scipy statsmodels

      - name: Generate earnings data
        working-directory: earnings/website
        run: python generate_data.py

      - name: Build earnings static site
        working-directory: earnings/website
        run: python freeze.py

      - name: Deploy earnings site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: earnings/website/build
          destination_dir: earnings
          force_orphan: false
          keep_files: true
